name: Generate Databases

on:
  push:
    branches: ["main"]
    tags: ["v*.*"]
  pull_request:
    types: [opened, reopened, synchronize]

env:
  # set to "true" to run generate_database with profiling it via py-spy
  USE_PYSPY: "false"

jobs:
  run-generate-database-sqdt:
    strategy:
      fail-fast: false
      matrix:
        species: [H, Li, Na, K, Rb, Cs, Sr88_sqdt]
        include:
          - extra_args: "--max-delta-n 10 --all-n-up-to 30 --warnings-as-exceptions"
          # use n_max=220 for tags and main, but only n_max=100 for PRs, etc.
          - arg_max: ${{ (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main') && '--n-max 220' || '--n-max 100' }}
          - species: Sr88_sqdt
            extra_args: "--max-delta-n 10 --all-n-up-to 30 "  # no warnings as exceptions, due to bad convergence
    name: ${{ matrix.species }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: 'true'
    - name: Install uv
      uses: astral-sh/setup-uv@v7
    - name: Sync uv dependencies
      run: uv sync --locked
    - name: Set database directory
      run: |
        VERSION=$(uv version --short)
        echo "DB_DIR=database/${{ matrix.species }}_v$VERSION" >> "$GITHUB_ENV"
    - name: Run generate_database.py
      run: |
        PROFILER=""
        if [ "$USE_PYSPY" = "true" ]; then
          PROFILER="py-spy record -o profile_${{ matrix.species }}.svg --"
        fi
        uv run $PROFILER generate_database sqdt ${{ matrix.species }} --directory "$DB_DIR" ${{ matrix.arg_max }} ${{ matrix.extra_args }}
    - name: Check that all tables were created
      run: ls "$DB_DIR"/{states,matrix_elements_d,matrix_elements_q,matrix_elements_q0,matrix_elements_mu,matrix_elements_o}.parquet
    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: database-${{ matrix.species }}
        path: |
          database/*/*.parquet
    - name: Upload profile
      if: always() && env.USE_PYSPY == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: profile-${{ matrix.species }}
        path: profile*.svg

  run-generate-database-misc:
    name: misc
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      # use f-max=220 for tags and main, but only f-max=120 for PRs, etc.
      ARG_MAX: ${{ (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main') && '--f-max 220' || '--f-max 120' }}
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: 'true'
    - name: Install uv
      uses: astral-sh/setup-uv@v7
    - name: Sync uv dependencies
      run: uv sync --locked
    - name: Set database directory
      run: |
        VERSION=$(uv version --short)
        echo "DB_DIR=database/misc_v$VERSION" >> "$GITHUB_ENV"
    - name: Run generate_database.py
      run: |
        PROFILER=""
        if [ "$USE_PYSPY" = "true" ]; then
          PROFILER="py-spy record -o profile_misc.svg --"
        fi
        uv run $PROFILER generate_database misc --directory "$DB_DIR" $ARG_MAX --warnings-as-exceptions
    - name: Check that all tables were created
      run: ls "$DB_DIR"/wigner.parquet
    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: database-misc
        path: |
          database/*/*.parquet
    - name: Upload profile
      if: always() && env.USE_PYSPY == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: profile-misc
        path: profile*.svg

  github-release:
    name: Release database files to github releases
    if: startsWith(github.ref, 'refs/tags/')  # only release to github on tag pushes
    needs: [run-generate-database-sqdt, run-generate-database-misc]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write

    steps:
    - name: Download all the database files
      uses: actions/download-artifact@v8
      with:
        path: database
        pattern: database-*
        merge-multiple: true

    - name: Zip database folders
      working-directory: database/
      run: |
        VERSION_TAG=${GITHUB_REF#refs/tags/}
        for dir in */; do
          if [[ "$dir" != *"$VERSION_TAG/" ]]; then
            echo "Error: Version mismatch between folder $dir and version tag $VERSION_TAG"
            exit 1
          fi
          zip -r "${dir%/}.zip" "$dir"
        done

    - name: Release zipped database folders
      uses: softprops/action-gh-release@v3
      with:
        files: database/*.zip
        draft: true
